# ===================================================================
# CloudCost AI - Production Profile Configuration (spring.profiles.active=prod)
# ===================================================================

# Server Configuration & Hardening
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-exception=false
server.error.include-binding-errors=never

# HTTP Gzip Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,text/css,text/javascript,application/javascript
server.compression.min-response-size=2048

# Database Connection & HikariCP Production Pooling
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cloudcost_ai?useSSL=true&requireSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=CloudCostProdHikariPool
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.connection-test-query=SELECT 1

# JPA & Hibernate Production Constraints
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Security & Secrets Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
cloudcost.security.credential-encryption-key=${CLOUD_CREDENTIAL_ENCRYPTION_KEY}
cloudcost.security.key-version=v1

# Production CORS - Must be explicitly configured to deployed frontend domains
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://cloudcost-ai.vercel.app,http://localhost:5173,http://localhost:3000}
cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# Reports Storage
cloudcost.reports.storage-dir=${REPORTS_STORAGE_DIR:reports_storage}

# Background Schedulers
cloudcost.billing.sync.schedule-enabled=${BILLING_SYNC_SCHEDULE_ENABLED:true}
cloudcost.billing.sync.fixed-delay-ms=${BILLING_SYNC_FIXED_DELAY_MS:3600000}
cloudcost.anomaly.schedule-enabled=${ANOMALY_SCHEDULE_ENABLED:true}
cloudcost.optimization.schedule-enabled=${OPTIMIZATION_SCHEDULE_ENABLED:true}

# Production Logging Hardening
logging.level.root=WARN
logging.level.com.cloudcostai=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Actuator & Health Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}
